<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Escudo Financiero — Configuración</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      background: #0f172a;
      color: #f1f5f9;
      padding: 24px;
      min-width: 400px;
      max-width: 500px;
    }
    h1 {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .subtitle {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 24px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    input {
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #f1f5f9;
      font-size: 13px;
      padding: 10px 12px;
      margin-bottom: 16px;
      outline: none;
      font-family: 'SFMono-Regular', Consolas, monospace;
    }
    input:focus { border-color: #3b82f6; }
    .btn-save {
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 24px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
    }
    .btn-save:hover { background: #2563eb; }
    #status {
      margin-top: 12px;
      font-size: 13px;
      min-height: 20px;
      color: #22c55e;
    }
    #status.error { color: #ef4444; }
    .hint {
      font-size: 11px;
      color: #475569;
      margin-top: -12px;
      margin-bottom: 16px;
      line-height: 1.4;
    }
    .divider {
      border: none;
      border-top: 1px solid #1e293b;
      margin: 20px 0;
    }
    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: #475569;
      font-weight: 600;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <h1>🛡️ Escudo Financiero</h1>
  <p class="subtitle">Configuración del MCP server</p>

  <div class="section-title">Conexión al MCP</div>

  <label for="mcp-url">URL del MCP server</label>
  <input
    id="mcp-url"
    type="url"
    placeholder="https://..."
    autocomplete="off"
    spellcheck="false"
  />

  <label for="mcp-key">API Key</label>
  <input
    id="mcp-key"
    type="password"
    placeholder="Pega aquí tu API key"
    autocomplete="off"
    spellcheck="false"
  />
  <p class="hint">La key se almacena localmente en el navegador y nunca se envía a terceros.</p>

  <button class="btn-save" id="save">Guardar configuración</button>
  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
