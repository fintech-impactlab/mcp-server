name: smoke-oidc

# Valida que las federated credentials de la App Registration de deploy funcionan
# desde GitHub Actions (push a main y PRs).
# Borrar cuando build-and-deploy.yml ejercite OIDC en cada run.
#
# Configuración del repo requerida (Settings → Secrets and variables → Actions → Secrets):
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, RESOURCE_GROUP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smoke-oidc.yml'
  pull_request:
    paths:
      - '.github/workflows/smoke-oidc.yml'

permissions:
  id-token: write
  contents: read

jobs:
  validate-oidc:
    runs-on: ubuntu-latest
    steps:
      - name: Azure login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Confirm subscription context
        run: az account show --output table

      - name: Confirm RG access
        run: |
          az group show \
            --name "${{ secrets.RESOURCE_GROUP }}" \
            --query "{name:name, location:location, state:properties.provisioningState}" \
            --output table
