name: Deploy web-v2 to Azure Container Apps

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: acrfintechdevic66pjdlbzw6e
  IMAGE_REPO: web-v2
  RESOURCE_GROUP: oarocha-fintech
  CONTAINER_APP: ca-web-v2-fintech-dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: ACR login
        run: az acr login --name "$ACR_NAME"

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_REPO }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Container App revision
        run: |
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "${ACR_NAME}.azurecr.io/${IMAGE_REPO}:${{ steps.meta.outputs.tag }}" \
            --query "properties.latestRevisionName" -o tsv

      - name: Wait for revision to become healthy
        run: |
          for i in $(seq 1 30); do
            STATE=$(az containerapp revision list \
              --name "$CONTAINER_APP" \
              --resource-group "$RESOURCE_GROUP" \
              --query "[?properties.active].properties.healthState | [0]" -o tsv)
            echo "revision health: ${STATE:-unknown}"
            [ "$STATE" = "Healthy" ] && exit 0
            sleep 5
          done
          echo "revision did not reach Healthy within 150s" >&2
          exit 1

      - name: Smoke test /api/health
        run: |
          FQDN=$(az containerapp show \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)
          curl -fsS --retry 5 --retry-delay 3 "https://${FQDN}/api/health" | tee /dev/stderr | grep -q '"status":"ok"'
